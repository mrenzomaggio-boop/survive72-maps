name: Build offline map areas

# Cuts each area of regions.json out of the latest Protomaps world build
# (OpenStreetMap data) and publishes the files on the "maps" release, where the
# SURVIVE 72 app downloads them:
# https://github.com/<owner>/survive72-maps/releases/download/maps/<id>.pmtiles
# Areas are split across 8 parallel jobs. When an area would be bigger than
# the 2 GB release file limit, its detail (maxzoom) is lowered until it fits.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Area ids to build, comma separated (empty = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 5 * *" # 5th of every month, 03:00 UTC

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.28.0"
  TAG: maps
  SHARDS: 8
  # Stay a little under GitHub's 2 GB per file.
  LIMIT_BYTES: 1950000000

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.source.outputs.url }}
      day: ${{ steps.source.outputs.day }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest world build
        id: source
        run: |
          for i in $(seq 0 14); do
            day=$(date -u -d "-$i day" +%Y%m%d)
            url="https://build.protomaps.com/${day}.pmtiles"
            if curl -sfI "$url" > /dev/null; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "day=$day" >> "$GITHUB_OUTPUT"
              echo "Using $url"
              exit 0
            fi
          done
          echo "No Protomaps build found in the last 15 days" >&2
          exit 1
      - name: Make sure the release exists
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Offline map areas" \
              --notes "Map data © OpenStreetMap contributors, available under the Open Database License (ODbL). Tiles built with Protomaps."
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.setup.outputs.url }}
      ONLY: ${{ github.event.inputs.only }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pmtiles
        run: |
          curl -sSL -o pmtiles.tgz "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          tar xzf pmtiles.tgz pmtiles
          ./pmtiles version

      - name: Cut and upload the areas of this shard
        run: |
          set -uo pipefail
          mkdir -p out
          echo '[]' > sizes.json
          : > too-big.txt
          : > failed.txt
          # Converts "915 kB", "55 MB", "2.3 GB" to bytes.
          to_bytes() { awk -v n="$1" -v u="$2" 'BEGIN{m=1; if(u=="kB")m=1e3; if(u=="MB")m=1e6; if(u=="GB")m=1e9; if(u=="TB")m=1e12; printf "%.0f", n*m}'; }
          index=0
          while read -r region; do
            n=$index; index=$((index + 1))
            id=$(jq -r '.id' <<< "$region")
            if [ -n "${ONLY:-}" ]; then
              [[ ",${ONLY// /}," == *",$id,"* ]] || continue
            elif [ $((n % SHARDS)) -ne ${{ matrix.shard }} ]; then
              continue
            fi
            bbox=$(jq -r '.bbox | map(tostring) | join(",")' <<< "$region")
            zoom=$(jq -r '.maxzoom' <<< "$region")
            echo "::group::$id bbox=$bbox"
            # Lower the detail until the file fits.
            chosen=""
            while [ "$zoom" -ge 8 ]; do
              line=$(./pmtiles extract "$SOURCE" /dev/null --bbox="$bbox" --maxzoom="$zoom" --dry-run 2>&1 | grep -o 'archive size of [0-9.]* [kMGT]*B' | tail -1)
              size=$(to_bytes $(awk '{print $4, $5}' <<< "$line"))
              echo "maxzoom $zoom: ${line:-no estimate}"
              if [ -n "$line" ] && [ "$size" -lt "$LIMIT_BYTES" ]; then chosen=$zoom; break; fi
              zoom=$((zoom - 1))
            done
            if [ -z "$chosen" ]; then
              echo "::error::$id does not fit in 2 GB even at maxzoom 8"
              echo "$id" >> too-big.txt; echo "::endgroup::"; continue
            fi
            file="out/$id.pmtiles"
            if ! ./pmtiles extract "$SOURCE" "$file" --bbox="$bbox" --maxzoom="$chosen" --download-threads=8; then
              echo "::error::extract failed for $id"; echo "$id" >> failed.txt; rm -f "$file"; echo "::endgroup::"; continue
            fi
            bytes=$(stat -c %s "$file")
            echo "$id: $((bytes / 1000000)) MB at maxzoom $chosen"
            if [ "$bytes" -ge 2000000000 ]; then
              echo "::error::$id is $bytes bytes, over 2 GB"; echo "$id" >> too-big.txt; rm -f "$file"; echo "::endgroup::"; continue
            fi
            ok=""
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then ok=1; break; fi
              sleep $((attempt * 20))
            done
            if [ -z "$ok" ]; then echo "$id" >> failed.txt; fi
            [ -n "$ok" ] && jq --arg id "$id" --argjson bytes "$bytes" --argjson z "$chosen" '. + [{id: $id, bytes: $bytes, maxzoom: $z}]' sizes.json > sizes.tmp && mv sizes.tmp sizes.json
            rm -f "$file"
            echo "::endgroup::"
          done < <(jq -c '.regions[]' regions.json)
          echo "Built: $(jq length sizes.json)"
          [ -s too-big.txt ] && echo "Too big: $(tr '\n' ' ' < too-big.txt)"
          [ -s failed.txt ] && echo "Failed: $(tr '\n' ' ' < failed.txt)"
          cp sizes.json "sizes-${{ matrix.shard }}.json"
          # The shard fails if any of its areas is missing.
          [ ! -s too-big.txt ] && [ ! -s failed.txt ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sizes-${{ matrix.shard }}
          path: sizes-${{ matrix.shard }}.json
          if-no-files-found: ignore

  catalog:
    needs: [setup, build]
    if: ${{ !cancelled() && github.event.inputs.only == '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ needs.setup.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sizes-*
          merge-multiple: true
      - name: Publish sizes
        run: |
          jq -s --arg day "$DAY" '{source_build: $day, areas: (add | sort_by(.id))}' sizes-*.json > catalog.json
          echo "Areas in catalog: $(jq '.areas | length' catalog.json) of $(jq '.regions | length' regions.json)"
          {
            echo "### Areas built from Protomaps build $DAY"
            echo
            echo "| Area | MB | maxzoom |"
            echo "|---|---:|---:|"
            jq -r '.areas[] | "| \(.id) | \(.bytes / 1000000 | floor) | \(.maxzoom) |"' catalog.json
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" catalog.json --clobber
